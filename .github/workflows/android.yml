name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compilar APK (debug instalable + release)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleFullDebug assembleFullRelease

      - name: Preparar archivos
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/full/debug/*.apk dist/ZenithAPKEditor-debug.apk
          cp app/build/outputs/apk/full/release/*.apk dist/ZenithAPKEditor-release-unsigned.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ZenithAPKEditor-${{ github.sha }}
          path: dist/*.apk

      # Al subir un tag (p. ej. v0.36-zenith1) se crea un Release con el APK listo para instalar
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZenithAPKEditor-debug.apk
          generate_release_notes: true
